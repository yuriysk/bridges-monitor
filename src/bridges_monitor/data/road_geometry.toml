# Геометрія автомобільних проїзних частин мостів для джерел даних про затори.
#
# Джерело істини — segments[].osm_ways: id ліній OpenStreetMap кожної споруди мосту,
# впорядковані за напрямком руху. Решту (segments[].points — початок, середина,
# кінець; route_points — 20% першої і 80% останньої споруди) генерує:
#   uv run python scripts/road_geometry.py
# Дніпро в Києві тече з півночі на південь, тож to_left_bank — рух на схід.

# Північний міст і міст через Десенку.
[[road]]
bridge = "bridge-pivnich"
direction = "to_left_bank"
segments = [
  { osm_ways = [23145427], points = [[50.489122, 30.530897], [50.490649, 30.535930], [50.492175, 30.540964]] },
  { osm_ways = [26560530], points = [[50.493591, 30.546823], [50.494255, 30.552057], [50.494938, 30.557286]] },
]
route_points = [[50.489732, 30.532910], [50.494665, 30.555194]]

[[road]]
bridge = "bridge-pivnich"
direction = "to_right_bank"
segments = [
  { osm_ways = [26560528], points = [[50.495043, 30.557250], [50.494365, 30.552029], [50.493709, 30.546802]] },
  { osm_ways = [23145431], points = [[50.492260, 30.540900], [50.490744, 30.535858], [50.489229, 30.530817]] },
]
route_points = [[50.494772, 30.555161], [50.489835, 30.532833]]

